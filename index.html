<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>הזמנת שסטוביץ</title>
    <!-- Bump the version when styles.css or app.js change, otherwise browsers
         keep serving the copy GitHub Pages told them to cache. -->
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">שסטוביץ</p>
        <h1>בחירת מוצרים להזמנה</h1>
      </div>
      <button type="button" class="cart-toggle" id="cartToggle">
        העגלה שלי
        <span class="badge" id="cartCount">0</span>
      </button>
    </header>

    <section class="toolbar">
      <label class="search">
        <span>חיפוש</span>
        <input
          id="search"
          type="search"
          placeholder="שם מוצר או ברקוד"
          autocomplete="off"
        />
      </label>
      <div class="brands" id="brands"></div>
    </section>

    <main>
      <p class="status" id="status">טוען מוצרים…</p>
      <section class="grid" id="grid"></section>
    </main>

    <aside class="drawer" id="drawer" hidden>
      <div class="drawer-head">
        <h2>העגלה שלי</h2>
        <button type="button" class="text-btn" id="closeCart">סגירה</button>
      </div>
      <label class="sender">
        <span>מי שולח את ההזמנה</span>
        <input
          id="sender"
          type="text"
          placeholder="השם שלך"
          autocomplete="name"
        />
      </label>
      <div class="cart-items" id="cartItems"></div>
      <div class="drawer-actions">
        <button type="button" class="primary" id="copyWhatsapp">
          העתקה לוואטסאפ
        </button>
        <button type="button" id="copyTsv" title="שורות עם טאבים - להדבקה באקסל, לא בוואטסאפ">
          העתקה לאקסל
        </button>
        <button type="button" id="downloadTxt">הורדת קובץ</button>
        <button type="button" class="danger text-btn" id="clearCart">ריקון</button>
      </div>
      <p class="hint">
        הטקסט למטה הוא מה שיישלח בוואטסאפ. אפשר לתקן שם מוצר ברשימה שמעל.
      </p>
      <pre class="preview" id="preview"></pre>
    </aside>
    <div class="backdrop" id="backdrop" hidden></div>

    <button type="button" class="to-top" id="toTop" hidden>
      <span aria-hidden="true">↑</span>
      חזרה למעלה
    </button>

    <script src="app.js?v=4" type="module"></script>
  </body>
</html>
